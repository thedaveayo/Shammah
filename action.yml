name: Shammah security scan
description: Scan code and dependencies for security issues, with plain-language fixes an AI agent can apply.
author: thedaveayo
branding:
  icon: shield
  color: blue

inputs:
  path:
    description: Folder to scan, relative to the repository root.
    default: "."
  fail-on:
    description: Fail the job if an issue this severe or worse is found (critical, high, medium, low, none).
    default: high
  dependencies:
    description: Also check lockfiles for vulnerable packages (sends package names and versions to OSV.dev, never code).
    default: "true"
  upload-sarif:
    description: Upload results to GitHub code scanning (needs `security-events write` permission).
    default: "false"
  api-key:
    description: Shammah Pro API key, for the full, always-updated rule feed. Leave empty to use the built-in rules.
    default: ""
  feed-url:
    description: URL of the Shammah Pro service (required with api-key).
    default: ""
  report:
    description: Send a scan summary (counts and rule IDs, never code) to your Shammah Pro dashboard.
    default: "false"

outputs:
  sarif-file:
    description: Path of the SARIF results file.
    value: ${{ steps.scan.outputs.sarif_file }}
  issues:
    description: Number of issues found.
    value: ${{ steps.scan.outputs.issues }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Shammah scanner
      shell: bash
      run: python -m pip install --quiet -r "$GITHUB_ACTION_PATH/mcp-server/requirements-scan.txt"

    - name: Restore scan cache
      uses: actions/cache@v4
      with:
        path: ${{ inputs.path }}/.shammah/cache.json
        key: shammah-${{ runner.os }}-${{ github.sha }}
        restore-keys: shammah-${{ runner.os }}-

    - name: Scan
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        WITH_DEPS: ${{ inputs.dependencies }}
        REPORT: ${{ inputs.report }}
        SHAMMAH_API_KEY: ${{ inputs.api-key }}
        SHAMMAH_FEED_URL: ${{ inputs.feed-url }}
        DATABASE_URL: sqlite:///${{ runner.temp }}/shammah.db
        AUTO_SYNC_ON_START: "false"
        BACKEND_URL: ""
        LOG_LEVEL: WARNING
      run: |
        args=(scan "$SCAN_PATH" --format sarif --output "$RUNNER_TEMP/shammah.sarif" --fail-on "$FAIL_ON")
        [ "$WITH_DEPS" = "true" ] || args+=(--no-deps)
        [ -n "$SHAMMAH_API_KEY" ] && args+=(--sync)
        [ "$REPORT" = "true" ] && args+=(--report)
        set +e
        python "$GITHUB_ACTION_PATH/mcp-server/main.py" "${args[@]}"
        code=$?
        set -e
        echo "sarif_file=$RUNNER_TEMP/shammah.sarif" >> "$GITHUB_OUTPUT"
        echo "issues=$(python -c "import json,sys; print(len(json.load(open(sys.argv[1]))['runs'][0]['results']))" "$RUNNER_TEMP/shammah.sarif" 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"

    - name: Upload to code scanning
      if: always() && inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif_file }}
        category: shammah

    - name: Result
      shell: bash
      env:
        CODE: ${{ steps.scan.outputs.exit_code }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        if [ "$CODE" = "1" ]; then
          echo "::error::Shammah found issues at or above '$FAIL_ON' severity. See the job summary for fixes."
          exit 1
        elif [ "$CODE" != "0" ]; then
          echo "::error::Shammah could not complete the scan (exit code $CODE)."
          exit 1
        fi

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component: [backend, mcp-server]
    defaults:
      run:
        working-directory: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx
      - name: Run tests
        # Tests listed in KNOWN_FAILING are older tests whose mocks no longer
        # match the code. Remove them from the list as they get fixed.
        env:
          KNOWN_FAILING_backend: >-
            --deselect tests/test_comprehensive.py::TestRuleModel::test_create_rule
            --deselect tests/test_comprehensive.py::TestRuleModel::test_rule_to_dict
            --deselect tests/test_comprehensive.py::TestRuleGenerator::test_llm_extract_cwe_patterns
            --deselect tests/test_comprehensive.py::TestQuickFixService::test_generate_quick_fix_suggestions
            --deselect tests/test_comprehensive.py::TestCWEFetcher::test_sync_cwe_taxonomy
          KNOWN_FAILING_mcp_server: >-
            --deselect tests/test_comprehensive.py::TestInfrastructureDetector::test_detect_empty_project
            --deselect tests/test_comprehensive.py::TestInfrastructureDetector::test_detect_package_json
        run: |
          if [ "${{ matrix.component }}" = "backend" ]; then
            python -m pytest tests $KNOWN_FAILING_backend
          else
            python -m pytest tests $KNOWN_FAILING_mcp_server
          fi

  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run compile
